services:
  rikkahub-rs:
    image: rikkahub-rs:cloud
    build: .
    container_name: rikkahub-rs
    env_file:
      - "${RIKKAHUB_ENV_FILE:-/opt/rikkahub-data/.env}"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATA_DIR: /data
      WEB_UI_DIR: /web-ui
      JWT_ENABLED: "true"
      APP_VERSION: rust-preview
      RUST_LOG: info
    ports:
      - "0.0.0.0:8091:8080"
    volumes:
      - "${RIKKAHUB_HOST_DATA_DIR:-/opt/rikkahub-data/data}:/data"
    restart: "no"
